# Repository conventions (docs/adr/0005-ai-agent-policy.md): branch name, PR title,
# commit messages and a hard ban on AI attribution. Required status check: "conventions".
name: conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: bash scripts/ci/check-branch-name.sh "$BRANCH"

  pr-title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE" --to "$HEAD" --verbose

  attribution-scan:
    name: attribution scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Scan commits, author emails and the pull request text
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          # Untrusted text is passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ALLOWED_COMMIT_EMAILS: ${{ vars.ALLOWED_COMMIT_EMAILS }}
        run: bash scripts/ci/scan-attribution.sh "$RANGE"

  conventions:
    name: conventions
    if: always()
    needs: [branch-name, pr-title, commits, attribution-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=0
          for job in branch-name pr-title commits attribution-scan; do
            result="$(echo "$RESULTS" | jq -r --arg job "$job" '.[$job].result')"
            echo "$job: $result"
            [ "$result" = "success" ] || failed=1
          done
          exit "$failed"
