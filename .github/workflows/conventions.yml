# Repository conventions (docs/adr/0005-ai-agent-policy.md): branch name, PR title,
# commit messages and a hard ban on AI attribution. Required status check: "conventions".
name: conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: bash scripts/ci/check-branch-name.sh "$BRANCH"

  pr-title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE" --to "$HEAD" --verbose

  attribution-scan:
    name: attribution scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Remove tool attribution footers from the pull request description
        # Some agent platforms append such footers on every write, even through the API, so the
        # removal happens here, out of their reach. Dependabot runs hold a read-only token and are
        # only checked.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bash scripts/ci/scrub-attribution.sh pr "$NUMBER"
      - name: Scan commits, identities and the current pull request text
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          SKIP_BODY: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
        run: |
          # The text is read back after the scrub and passed through the environment, never interpolated.
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .title)"
          PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.body // ""')"
          export PR_TITLE PR_BODY
          bash scripts/ci/scan-attribution.sh "$RANGE"

  tests-required:
    name: tests required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Application code changes come with tests
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/ci/check-tests-required.sh "$RANGE"

  conventions:
    name: conventions
    if: always()
    needs: [branch-name, pr-title, commits, attribution-scan, tests-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=0
          for job in branch-name pr-title commits attribution-scan tests-required; do
            result="$(echo "$RESULTS" | jq -r --arg job "$job" '.[$job].result')"
            echo "$job: $result"
            [ "$result" = "success" ] || failed=1
          done
          exit "$failed"
