# Heavy tier (docs/adr/0004-testing-and-ci-strategy.md): browser tests, visual parity,
# accessibility and Lighthouse against a deployed URL. Runs for Vercel preview
# deployments of pull requests labelled "run-e2e", on every master push (staging),
# nightly and on demand. Advisory on pull requests; the master run is the gate.
name: e2e

on:
  deployment_status:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Target URL (defaults to the STAGING_URL repository variable)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  deployments: read

# Every run against staging takes its turn: two at once share one database, one administrator
# and one set of pages, and each undid the other's setup (issue #17). A newer commit's run waits
# rather than cancelling one that is halfway through. A deployment has a group of its own: the
# production deployment's `deployment_status` arrives for the commit the `push` run is testing,
# and used to cancel it before skipping itself as not a preview.
concurrency:
  group: e2e-${{ github.event_name == 'deployment_status' && format('deployment-{0}', github.event.deployment.sha) || 'staging' }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  LEFTHOOK: '0'

jobs:
  gate:
    name: gate
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      base_url: ${{ steps.gate.outputs.base_url }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        with:
          script: |
            if (context.eventName !== 'deployment_status') {
              const baseUrl = process.env.INPUT_BASE_URL || process.env.STAGING_URL
              core.setOutput('run', String(Boolean(baseUrl)))
              core.setOutput('base_url', baseUrl || '')
              core.setOutput('sha', context.sha)
              if (!baseUrl) core.warning('No target URL: set the STAGING_URL repository variable or pass base_url.')
              return
            }
            const sha = context.payload.deployment.sha
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: sha,
            })
            const labelled = prs.some((pr) => pr.labels.some((label) => label.name === 'run-e2e'))
            core.setOutput('run', String(labelled))
            core.setOutput('base_url', context.payload.deployment_status.environment_url || context.payload.deployment_status.target_url || '')
            core.setOutput('sha', sha)
            if (!labelled) core.notice('Preview deployment without the run-e2e label; skipping.')

  browser:
    name: browser tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: ${{ needs.gate.outputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The administrator the tiers sign in as is created through the Payload Local API before the
      # run (issue #343), in the database the target deployment reads (issue #17). The secret only
      # has to pass `src/lib/env.ts`: sessions are signed by the deployment, not by this job.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ci-only-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end
        run: bun run test:e2e
      - name: Legacy baseline bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/baselines/download-legacy-bundle.sh
      - name: Visual parity
        run: bun run test:visual
      - name: Accessibility (advisory)
        continue-on-error: true
        run: bun run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ needs.gate.outputs.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  lighthouse:
    name: lighthouse
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The budgets gate `master` and the nightly run; a preview is told, not stopped (issue #177).
    continue-on-error: ${{ github.event_name == 'deployment_status' }}
    env:
      BASE_URL: ${{ needs.gate.outputs.base_url }}
      # Without it Lighthouse is redirected to the Vercel login and scores that (issue #246).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Pages to audit
        id: pages
        # The detail page is the listing's first card, so it is one the deployment really has.
        run: |
          detail="$(curl -sL ${VERCEL_AUTOMATION_BYPASS_SECRET:+-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"} \
            "$BASE_URL/en/aircraft" | grep -o 'href="/en/aircraft/[^"]*"' | head -1 | cut -d'"' -f2)"
          if [ -z "$detail" ]; then echo "::error::the aircraft listing links to no aircraft"; exit 1; fi
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            ${{ env.BASE_URL }}/en
            ${{ env.BASE_URL }}/en/aircraft
            ${{ env.BASE_URL }}${{ steps.pages.outputs.detail }}
            ${{ env.BASE_URL }}/en/yachts
          runs: 3
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

  budget-issue:
    name: budget issue
    needs: lighthouse
    # `needs.lighthouse.result` rather than `failure()`: the job may not fail the workflow on a
    # preview, and only `master` and the nightly run open an issue.
    if: always() && needs.lighthouse.result == 'failure' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Lighthouse budgets exceeded on staging'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const line = `The \`lighthouse\` job of the ${context.eventName === 'schedule' ? 'nightly run' : `push of ${context.sha.slice(0, 7)}`} failed its budgets: ${run} (the assertions are in its log, the reports in its artifact).`
            // One open issue collects every failure, so a regression that lasts a week is one thread.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'area:seo',
              per_page: 100,
            })
            const existing = open.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: line })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ['type:bug', 'area:seo', 'priority:p1'],
                body: `${line}\n\nThe budgets and the legacy numbers they come from: \`lighthouserc.cjs\`, \`docs/performance-baseline.md\` (issue #177).`,
              })
            }
