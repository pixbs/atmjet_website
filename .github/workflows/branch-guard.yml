# Defence in depth behind the branch-name check (AGENTS.md section 1): a branch created with a
# tool prefix (claude/, codex/, copilot/, cursor/ or the placeholder prefix) is deleted right after
# creation and any pull request opened from it is told why. Runs from the default branch.
name: branch guard

on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    name: delete tool-prefixed branches
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: scripts/ci
      - name: Check the new branch name against the forbidden prefixes
        id: check
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          if bash scripts/ci/check-branch-name.sh --deny-only "$BRANCH"; then
            echo "forbidden=false" >> "$GITHUB_OUTPUT"
          else
            echo "forbidden=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete the branch and explain on its pull requests
        if: steps.check.outputs.forbidden == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.ref }}
        run: |
          for pr in $(gh pr list --head "$BRANCH" --json number --jq '.[].number'); do
            gh pr comment "$pr" --body "Branch \`$BRANCH\` uses a forbidden tool prefix (AGENTS.md section 1) and was deleted. Recreate it as \`<type>/<issue>-<slug>\` and push again."
          done
          git push origin --delete "$BRANCH"
