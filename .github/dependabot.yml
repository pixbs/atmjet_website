version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Playwright 1.59 and later load the specs through their own ESM loader instead of tsx's,
      # and `tests/helpers/seedUser.ts` reaches the Payload config, whose `next/cache` import
      # has no extension and no `exports` entry to resolve through. Held back until #275 lands.
      - dependency-name: '@playwright/test'
        versions: ['>=1.59.0']
    labels: [type:chore]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels: [type:chore, area:ci]
