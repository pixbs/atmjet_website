name: Epic
description: A group of related issues tracked as sub-issues.
title: 'Epic: '
labels: ['epic']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done for the epic
    validations:
      required: true
  - type: textarea
    id: subissues
    attributes:
      label: Sub-issues
      description: Added as GitHub sub-issues; list them here for the overview.
