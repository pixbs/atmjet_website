# Local git hooks (docs/adr/0005-ai-agent-policy.md, CONTRIBUTING.md).
# Installed by `bun install` (package.json "prepare") or `bunx lefthook install`.
# The conventions and ci workflows are the enforcement (ADR-0008); hooks only keep the feedback loop short.
min_version: 2.0.0

pre-commit:
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,mdx,yml,yaml,css}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,js,mjs}'
      run: bunx eslint --max-warnings=0 --no-warn-ignored {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bash scripts/ci/sanitize-commit-msg.sh {1} && bunx commitlint --edit {1}
